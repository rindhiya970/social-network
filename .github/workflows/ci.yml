name: CivicAlert Phase 8 CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            CivicAlert/civicalert-backend/package-lock.json
            CivicAlert/civicalert-mobile/package-lock.json

      # --- Backend Build & Test ---
      - name: Install Backend Dependencies
        run: npm ci
        cwd: CivicAlert/civicalert-backend

      - name: Run Backend Tests (Jest)
        run: npm test
        cwd: CivicAlert/civicalert-backend

      # --- Mobile/Frontend Build & Test ---
      - name: Install Mobile Dependencies
        run: npm ci --legacy-peer-deps
        cwd: CivicAlert/civicalert-mobile

      - name: Run TypeScript Diagnostics
        run: npm run tsc
        cwd: CivicAlert/civicalert-mobile

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps
        cwd: CivicAlert/civicalert-mobile

      - name: Run Playwright E2E Tests
        run: npm run test:e2e
        cwd: CivicAlert/civicalert-mobile
        env:
          CI: true
          E2E_SECRET: civicalert-e2e-reset-secret
